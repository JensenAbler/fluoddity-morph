    # Telemetry receiver (server/log_receiver.py). Rate-limited per IP; the
    # zone `fmlog` is defined in /etc/nginx/conf.d/fluoddity-morph-log.conf.
    location = /api/log {
        limit_req zone=fmlog burst=30 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8787;
    }
